name: Legado
options:
  bundleIdPrefix: io.legado
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# 依赖以预编译 XCFramework 形式链接，源码与二进制均由 scripts/ 下的脚本生成：
#   ./scripts/fetch-vendor.sh              # 从镜像下载源码
#   ./scripts/build-vendor-frameworks.sh   # 编译成 Vendor/Frameworks/*.xcframework
# 本机若禁止嵌套 sandbox-exec，宏插件（@Observable / @State）启动
# swift-plugin-server 会报 "sandbox_apply: Operation not permitted"；
# 关掉编译器子进程沙箱即可，对产物无影响。
settings:
  base:
    SWIFT_VERSION: "5.0"
    OTHER_SWIFT_FLAGS: >-
      $(inherited)
      -Xfrontend -disable-sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

# 依赖直接用 SwiftPM 从 GitHub 拉取（Git 协议），版本锁死。
# 本机网络需要代理时用 ./scripts/build.sh --proxy（默认 127.0.0.1:10808）。
packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.14.3
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.0.0

targets:
  Legado:
    type: application
    platform: iOS
    sources:
      - path: Legado
    settings:
      base:
        PRODUCT_NAME: Legado
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios
        INFOPLIST_FILE: Legado/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Legado/Core/XML/Legado-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SDKROOT)/usr/include/libxml2
        OTHER_LDFLAGS: -lxml2
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SwiftSoup
        product: SwiftSoup
      - package: GRDB
        product: GRDB

  LegadoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LegadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Legado
