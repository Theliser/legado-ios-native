name: Legado
options:
  bundleIdPrefix: io.legado
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# 依赖以预编译 XCFramework 形式链接，源码与二进制均由 scripts/ 下的脚本生成：
#   ./scripts/fetch-vendor.sh              # 从镜像下载源码
#   ./scripts/build-vendor-frameworks.sh   # 编译成 Vendor/Frameworks/*.xcframework
# 主工程不参与 SPM 依赖解析（本机 xcodebuild 解析清单会因 sandbox-exec 失败）。
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 本机环境禁止嵌套 sandbox-exec，导致宏插件（@Observable / @State 等）
    # 启动 swift-plugin-server 时报 "sandbox_apply: Operation not permitted"。
    # 关掉编译器子进程沙箱即可，对产物无影响。
    OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-sandbox
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Legado:
    type: application
    platform: iOS
    sources:
      - path: Legado
    settings:
      base:
        PRODUCT_NAME: Legado
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios
        INFOPLIST_FILE: Legado/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Legado/Core/XML/Legado-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SDKROOT)/usr/include/libxml2
        OTHER_LDFLAGS: -lxml2
        # GRDB 的 .swiftmodule 依赖 GRDBSQLite 这个 system library 模块，
        # 预编译成二进制后需要把它的 modulemap 显式暴露给主工程。
        OTHER_SWIFT_FLAGS: >-
          $(inherited)
          -Xcc -fmodule-map-file=$(SRCROOT)/Vendor/GRDB.swift/Sources/GRDBSQLite/module.modulemap
          -Xcc -I$(SRCROOT)/Vendor/GRDB.swift/Sources/GRDBSQLite
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      # 静态框架：只链接，不嵌入
      - framework: Vendor/Frameworks/SwiftSoup.xcframework
        embed: false
        codeSign: false
      - framework: Vendor/Frameworks/GRDB.xcframework
        embed: false
        codeSign: false

  LegadoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LegadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Legado
