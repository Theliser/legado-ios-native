name: Legado
options:
  bundleIdPrefix: io.legado
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  Legado:
    type: application
    platform: iOS
    sources:
      - path: Legado
    settings:
      base:
        PRODUCT_NAME: Legado
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios
        INFOPLIST_FILE: Legado/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_OBJC_BRIDGING_HEADER: Legado/Core/XML/Legado-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SDKROOT)/usr/include/libxml2
        OTHER_LDFLAGS: -lxml2
        DEVELOPMENT_ASSET_PATHS: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: SwiftSoup
      - package: GRDB

  LegadoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LegadoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.legado.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Legado
