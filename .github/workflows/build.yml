name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    # 工程部署目标 iOS 26.0，需要 Xcode 26；macos-26 镜像默认就是 Xcode 26.x。
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 Release 更新内容需要完整历史和 tag
          fetch-depth: 0

      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Legado.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
            spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app
        # GitHub 托管 runner 直连 GitHub 很快，不需要代理
        run: ./scripts/build.sh

      - name: Package simulator app
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/Legado.app"
          test -d "$APP"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/artifacts/Legado-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Legado-simulator
          path: build/artifacts/Legado-simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release notes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p build/artifacts
          PREV="$(git describe --tags --abbrev=0 --match 'v1.0.0-build.*' 2>/dev/null || true)"
          {
            echo "## 自动构建"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${GITHUB_SHA::7}\` |"
            echo "| 分支 | \`${GITHUB_REF_NAME}\` |"
            echo "| 时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            echo "## 更新内容"
            echo
            if [ -n "$PREV" ]; then
              NOTES="$(git log --pretty=format:'- %s（`%h`）' "$PREV..HEAD")"
            else
              NOTES="$(git log --pretty=format:'- %s（`%h`）' -20)"
            fi
            if [ -z "$NOTES" ]; then
              NOTES="- 本次没有新的代码提交"
            fi
            echo "$NOTES"
            echo
            echo "## 产物"
            echo
            echo "- \`Legado-simulator.zip\`：iOS 模拟器 Debug 构建，解压后可以直接拖进 Simulator 运行"
          } > build/artifacts/release-notes.md
          cat build/artifacts/release-notes.md

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build.${{ github.run_number }}.${{ github.run_attempt }}
          name: "Legado iOS 自动构建 #${{ github.run_number }}"
          body_path: build/artifacts/release-notes.md
          files: build/artifacts/Legado-simulator.zip
          prerelease: true
          fail_on_unmatched_files: true
