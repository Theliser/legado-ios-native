name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    # 工程部署目标 iOS 26.0，需要 Xcode 26；macos-26 镜像默认就是 Xcode 26.x。
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        id: xcode
        run: |
          xcodebuild -version
          echo "version=$(xcodebuild -version | head -1 | tr ' ' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('project.yml', 'Legado.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ steps.xcode.outputs.version }}-
            spm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app
        # GitHub 托管 runner 直连 GitHub 很快，不需要代理
        run: ./scripts/build.sh

      - name: Package simulator app
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/Legado.app"
          test -d "$APP"
          mkdir -p build/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP" build/artifacts/Legado-simulator.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Legado-simulator
          path: build/artifacts/Legado-simulator.zip
          if-no-files-found: error
          retention-days: 7
